name: Get Youtube Transcipt Mail

on:
    schedule:
        # Runs every day at 00:00 UTC
        - cron: "0 0 * * *"

    # Optional: allows you to run it manually from GitHub Actions
    workflow_dispatch:

jobs:
    run-script:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  if [ -f requirements.txt ]; then
                    pip install -r requirements.txt
                  fi

            - name: Run main.py
              run: python main.py
